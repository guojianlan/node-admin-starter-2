name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin_base
          POSTGRES_PASSWORD: admin_base
          POSTGRES_DB: admin_base
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin_base -d admin_base"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://admin_base:admin_base@localhost:5432/admin_base
      ADMIN_BASE_SECRET_KEY: ci-admin-base-secret
      ADMIN_BASE_ADMIN_PASSWORD: ci-admin-password-123
      NODE_ENV: test
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:check-cases
      - run: pnpm admin:check-routes
      - run: pnpm build
      - name: Create isolated browser test database
        env:
          PGPASSWORD: admin_base
        run: createdb -h localhost -U admin_base admin_base_test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Smoke
        run: |
          NODE_ENV=production pnpm start > /tmp/admin-base-next.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then
              break
            fi
            if [ "$i" = "60" ]; then
              cat /tmp/admin-base-next.log
              exit 1
            fi
            sleep 1
          done
          SMOKE_BASE_URL=http://localhost:3000 SMOKE_PASSWORD=ci-admin-password-123 pnpm smoke
